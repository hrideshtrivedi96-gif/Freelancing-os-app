name: Build Android APK with Buildozer

on:
  workflow_dispatch: # इससे आप जब चाहें मैन्युअल रूप से बटन दबाकर बिल्ड शुरू कर सकते हैं

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Cloud Code
      uses: actions/checkout@v4

    - name: Get Time Hex
      id: get-time
      run: echo "TIME=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Setup Android SDK and Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Build APK with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android debug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-bot-apk-${{ steps.get-time.outputs.TIME }}
        path: bin/*.apk
